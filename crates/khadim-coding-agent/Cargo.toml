[package]
name = "khadim-coding-agent"
version = "0.1.0"
edition = "2021"
description = "Shared coding-agent runtime and tool loop for Khadim"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["khadim", "agent", "cli", "automation"]
categories = ["development-tools", "command-line-interface"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
khadim-ai-core = { version = "0.1.0", path = "../khadim-ai-core" }
khadim-code-graph = { version = "0.1.0", path = "../khadim-code-graph" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
ignore = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["lib"]
