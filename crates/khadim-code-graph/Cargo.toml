[package]
name = "khadim-code-graph"
version = "0.1.0"
edition = "2021"
description = "Tree-sitter parsing layer for Khadim: parse cache, node spans, checkable predicates"
license = "AGPL-3.0-only"
keywords = ["khadim", "tree-sitter", "ast", "code-graph"]
categories = ["development-tools", "parsing"]

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["lib"]